[package]
name = "jinij-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web フレームワーク
axum = { version = "0.7", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# シリアライズ
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# データベース (Supabase は REST 経由 / PostgreSQL 直接)
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }

# 認証 (Supabase JWT 検証)
jsonwebtoken = "9"

# HTTP クライアント (Supabase Edge Functions など)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# ユーティリティ
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"

# CSV エクスポート
csv = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
